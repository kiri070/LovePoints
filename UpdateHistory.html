<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>更新履歴</title>


<link rel="stylesheet" href="UpdateHistory.css?v=0.05">


</head>
<body>
    <h1 data-i18n="title">更新履歴</h1>


<div id="update">

    <div>
        <h2>2026/9/21</h2>
        <hr>
        <p data-i18n-html="starFeature">
            ・星を描く機能を追加<br>
        </p>
    </div>

    <div>
        <h2>2026/9/18</h2>
        <hr>
        <p data-i18n-html="englishVersion">
            ・英語版に対応<br>
            ・ボタンのアニメーションが正しく再生されない不具合を修正
        </p>
    </div>

    <div>
        <h2>2026/9/16</h2>
        <hr>
        <p data-i18n-html="release">
            ・リリース<br>
        </p>
    </div>
    
</div>

<script>
    const translations = {
        ja: {
            documentTitle: "更新履歴",
            title: "更新履歴",
            starFeature:
                "・星を描く機能を追加<br>",
            release:
                "・リリース<br>",
            englishVersion:
                "・英語版に対応<br>" +
                "・ボタンのアニメーションが正しく再生されない不具合を修正"
        },
        en: {
            documentTitle: "Update History",
            title: "Update History",
            starFeature:
                "- Added a feature to draw stars<br>",
            release:
                "- Released<br>",
            englishVersion:
                "- Added English support<br>" +
                "- Fixed an issue where button animations did not play correctly"
        }
    };

    const params = new URLSearchParams(window.location.search);

    const selectedLanguage =
        params.get("lang") === "en" ||
        localStorage.getItem("lovePointsLanguage") === "en"
            ? "en"
            : "ja";

    const translation =
        translations[selectedLanguage];

    document.documentElement.lang =
        selectedLanguage;

    document.title =
        translation.documentTitle;

    document.querySelectorAll("[data-i18n]").forEach(function (element) {
        element.textContent =
            translation[element.dataset.i18n];
    });

    document.querySelectorAll("[data-i18n-html]").forEach(function (element) {
        element.innerHTML =
            translation[element.dataset.i18nHtml];
    });
</script>


</body>
</html>
